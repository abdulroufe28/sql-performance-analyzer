<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="dbGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Hex Shield with Glass Gradient -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="#0f172a" stroke="url(#dbGlow)" stroke-width="1.75" />
  
  <!-- Database Disks / Nodes -->
  <!-- Top Disk -->
  <ellipse cx="24" cy="14" rx="14" ry="4.5" fill="none" stroke="url(#dbGlow)" stroke-width="2" />
  
  <!-- Middle Tier -->
  <path d="M10 14v8c0 2.5 6.27 4.5 14 4.5s14-2 14-4.5v-8" fill="none" stroke="url(#dbGlow)" stroke-width="2" stroke-linecap="round" />
  
  <!-- Bottom Tier -->
  <path d="M10 22v8c0 2.5 6.27 4.5 14 4.5s14-2 14-4.5v-8" fill="none" stroke="url(#dbGlow)" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <!-- Speed Pulse Lightning Bolt -->
  <path d="M26 8L16 23h8l-2 13 12-16h-8l2-12z" fill="url(#boltGrad)" filter="url(#neon)" />
</svg>
